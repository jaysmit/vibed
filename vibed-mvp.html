<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibed — the story, from the person who lived it</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,600..900,0..100,0..1&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --page:#FFFFFF;--bg:#F4F4F1;--soft:#F8F8F6;
  --ink:#0E0E0E;--ink-2:#565656;--ink-3:#8A8A8A;
  --rule:#E4E4E1;--rule-2:#CFCFCB;
  --go:#05CE78;--go-deep:#017A4C;--go-tint:#E6F9F0;
  --heat:#5A2EC4;--heat-tint:#EEE9FB;
  --warn:#B7791F;--warn-tint:#FBF1DE;
  --dead:#B03A28;--dead-tint:#FBEAE6;
  --display:'Fraunces',Georgia,serif;--body:'Inter',system-ui,sans-serif;--mono:'IBM Plex Mono',monospace;
  --wrap:1180px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);overflow-x:hidden;font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--go-deep);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);font-variation-settings:'SOFT' 60,'WONK' 1;letter-spacing:-.018em;line-height:1.14}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header */
header.top{border-bottom:1px solid var(--rule);background:var(--page);position:sticky;top:0;z-index:30}
.top-in{display:flex;align-items:center;gap:16px;height:68px}
.mark{font-family:var(--display);font-weight:900;font-variation-settings:'SOFT' 80,'WONK' 1;font-size:23px;letter-spacing:-.03em;display:flex;align-items:center;gap:9px}
.mk{height:20px;flex:none;overflow:visible}
.mk rect{fill:var(--ink);transform-origin:bottom;animation:rise .55s cubic-bezier(.2,.9,.3,1) backwards}
.mk rect.cash{fill:var(--go)}
.mk rect:nth-child(1){animation-delay:.02s}.mk rect:nth-child(2){animation-delay:.09s}.mk rect:nth-child(3){animation-delay:.16s}
.mk rect:nth-child(4){animation-delay:.23s}.mk rect:nth-child(5){animation-delay:.30s}.mk rect:nth-child(6){animation-delay:.37s}
@keyframes rise{from{transform:scaleY(.06)}to{transform:scaleY(1)}}
.search{flex:1;max-width:330px;position:relative}
.search input{width:100%;background:var(--bg);border:1px solid var(--rule);border-radius:999px;padding:9px 14px 9px 36px;font:inherit;font-size:14px}
.search input:focus{outline:none;border-color:var(--ink);background:var(--page)}
.search .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.45;display:flex}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--page);border:1px solid var(--rule);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.10);overflow:hidden;z-index:40}
.results a{display:flex;gap:10px;align-items:center;padding:10px 13px;font-size:14px;border-bottom:1px solid var(--rule)}
.results a:last-child{border-bottom:none}.results a:hover{background:var(--soft)}
.results .sub{color:var(--ink-3);font-size:12.5px}
.results .none{padding:15px 13px;font-size:13.5px;color:var(--ink-3)}
.res-head{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:10px 13px 5px;background:var(--soft);font-weight:600}
.actions{display:flex;align-items:center;gap:6px;margin-left:auto}
.lnk{font-size:14px;font-weight:500;color:var(--ink-2);padding:8px 12px;border-radius:999px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.lnk:hover{color:var(--ink);background:var(--soft)}
.count{font-family:var(--mono);font-size:10px;background:var(--go-deep);color:#fff;border-radius:999px;padding:1px 6px}
.btn{border-radius:999px;font-weight:600;transition:.15s;display:inline-block;text-align:center}
.btn-go{background:var(--go);color:#00301E}.btn-go:hover{background:#04B76B}
.btn-ink{background:var(--ink);color:#fff}.btn-ink:hover{background:#333}
.btn-lg{padding:13px 26px;font-size:15px}.btn-sm{padding:8px 15px;font-size:14px}
.icon-btn{display:none;padding:8px;border-radius:999px;color:var(--ink-2)}
.me{width:32px;height:32px;border-radius:50%;background:var(--heat);color:#fff;display:grid;place-items:center;font:600 11px var(--mono)}
.filters{border-bottom:1px solid var(--rule);background:var(--page);position:sticky;top:68px;z-index:25}
.filters-in{display:flex;gap:26px;height:50px;align-items:center;overflow-x:auto;scrollbar-width:none}
.filters-in::-webkit-scrollbar{display:none}
nav.rungs{display:flex;gap:26px}
nav.rungs a{font-size:14px;color:var(--ink-2);white-space:nowrap;padding:15px 0;border-bottom:2px solid transparent;font-weight:500}
nav.rungs a:hover{color:var(--ink)}
nav.rungs a.on{color:var(--ink);border-bottom-color:var(--go)}

/* video poster */
.poster{position:relative;overflow:hidden;background:var(--soft)}
.poster .art{position:absolute;inset:0;width:100%;height:100%;transition:transform .6s cubic-bezier(.2,.8,.3,1)}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.16) 0%,rgba(0,0,0,0) 34%,rgba(0,0,0,.04) 62%,rgba(0,0,0,.42) 100%);pointer-events:none}
.card:hover .poster .art,.big:hover .poster .art{transform:scale(1.05)}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;z-index:3;box-shadow:0 4px 18px rgba(0,0,0,.18);transition:transform .25s cubic-bezier(.2,.8,.3,1)}
.play svg{margin-left:3px}
.card:hover .play,.big:hover .play{transform:translate(-50%,-50%) scale(1.1)}
.dur{position:absolute;right:10px;bottom:10px;z-index:3;background:rgba(0,0,0,.72);color:#fff;font:500 11px var(--mono);padding:3px 8px;border-radius:5px}
.clip-q{position:absolute;left:12px;right:78px;bottom:10px;z-index:3;color:#fff;font-size:12.5px;font-weight:500;line-height:1.35;text-shadow:0 1px 6px rgba(0,0,0,.5);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{position:absolute;top:12px;left:12px;z-index:3;background:var(--page);border-radius:999px;padding:5px 11px;font-size:11px;font-weight:600;box-shadow:0 1px 5px rgba(0,0,0,.14);display:flex;align-items:center;gap:6px}
.badge.pick{color:var(--go-deep)}.badge.closed{color:var(--dead)}
.badge.rank{background:var(--ink);color:#fff;font-family:var(--mono);letter-spacing:.02em;gap:5px}
.badge.rank em{font-style:normal;color:var(--go)}
.rung-tag{position:absolute;top:12px;right:12px;z-index:3;background:rgba(255,255,255,.93);backdrop-filter:blur(6px);border-radius:999px;padding:6px 11px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 5px rgba(0,0,0,.10)}
.rung-tag span{font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2)}
.ladder{display:flex;gap:3px;align-items:flex-end;height:13px}
.ladder b{display:block;width:9px;background:var(--rule-2);border-radius:1px}
.ladder b:nth-child(1){height:4px}.ladder b:nth-child(2){height:6px}.ladder b:nth-child(3){height:8px}
.ladder b:nth-child(4){height:10px}.ladder b:nth-child(5){height:11.5px}.ladder b:nth-child(6){height:13px}
.ladder b.fill{background:var(--ink)}.ladder b.fill.cash{background:var(--go)}.ladder.dead b.fill{background:var(--dead)}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;position:absolute;left:12px;bottom:12px;z-index:3;box-shadow:0 2px 10px rgba(0,0,0,.25);transition:transform .28s cubic-bezier(.2,.8,.3,1)}
.logo svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.card:hover .logo{transform:scale(1.08) rotate(-4deg)}
.logo-xs{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;position:static;box-shadow:none}
.logo-xs svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.av{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:600;color:#fff;font-family:var(--mono);flex:none}

/* cards */
.section{padding:42px 0}
.section+.section{border-top:1px solid var(--rule)}
.sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:24px;flex-wrap:wrap;animation:fadeIn .5s cubic-bezier(.2,.8,.3,1) backwards}
.sec-head h2{font-size:27px;font-weight:800}
.sec-head .note{font-size:14px;color:var(--ink-3)}
.sec-head .more{margin-left:auto;font-size:14px;font-weight:600;color:var(--go-deep)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.card{background:var(--page);border:1px solid var(--rule);border-radius:14px;overflow:hidden;cursor:pointer;position:relative;
 box-shadow:0 1px 3px rgba(0,0,0,.045);transition:transform .28s cubic-bezier(.2,.8,.3,1),box-shadow .28s cubic-bezier(.2,.8,.3,1);
 animation:cardIn .55s cubic-bezier(.2,.8,.3,1) backwards}
.card:hover{transform:translateY(-5px);box-shadow:0 14px 32px rgba(0,0,0,.11)}
.card .poster{height:176px}
.card-body{padding:15px 17px 17px}
.card h3{font-size:18.5px;font-weight:700}
.card:hover h3{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.card .pitch{font-size:13.5px;color:var(--ink-2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.creator{font-size:13px;color:var(--ink-3);margin-top:9px;display:flex;align-items:center;gap:7px}

/* promise clock */
.promise{margin-top:13px;background:var(--soft);border:1px solid var(--rule);border-radius:10px;padding:11px 12px}
.promise .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.promise .txt{font-size:13px;font-weight:600;line-height:1.35}
.promise .left{font-family:var(--mono);font-size:11.5px;color:var(--warn);white-space:nowrap;font-weight:500}
.promise .left.safe{color:var(--go-deep)}
.promise .eyebrow{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:5px}
.bar{height:5px;background:#E7E7E3;border-radius:999px;overflow:hidden;margin-top:9px;position:relative}
.bar i{display:block;height:100%;background:var(--go);border-radius:999px;width:0;transition:width 1.1s cubic-bezier(.2,.9,.3,1);position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;width:38%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);animation:sheen 2.8s cubic-bezier(.4,0,.2,1) infinite}
.bar.tight i{background:var(--warn)}.bar.dead i{background:var(--dead)}.bar.done i{background:var(--ink)}
.kept{display:flex;gap:5px;margin-top:9px;align-items:center}
.kept b{width:7px;height:7px;border-radius:50%;background:var(--rule-2);display:block}
.kept b.y{background:var(--go)}.kept b.n{background:var(--dead)}
.kept span{font-size:11px;color:var(--ink-3);margin-left:4px}
.metaline{display:flex;gap:14px;margin-top:12px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.metaline b{color:var(--ink);font-weight:600;font-family:var(--mono)}
.card-actions{display:flex;align-items:center;gap:9px;margin-top:13px}
.jlink{margin-left:auto;font-size:13px;font-weight:600;color:var(--go-deep);white-space:nowrap;transition:transform .2s}
.card:hover .jlink{transform:translateX(3px)}
.clip .cap,.clip .who{cursor:pointer}
.follow{font-size:13px;font-weight:600;border:1px solid var(--rule-2);padding:6px 15px;border-radius:999px;transition:.15s}
.follow:hover{border-color:var(--ink);background:var(--soft)}
.follow.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill{font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px}
.p-go{background:var(--go-tint);color:var(--go-deep)}
.p-heat{background:var(--heat-tint);color:var(--heat)}
.p-warn{background:var(--warn-tint);color:var(--warn)}
.p-dead{background:var(--dead-tint);color:var(--dead)}
.p-mute{background:var(--soft);color:var(--ink-3)}

/* featured */
.feature{padding:36px 0 44px;border-bottom:1px solid var(--rule)}
.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--go-deep);margin-bottom:16px}
.big-in{display:grid;grid-template-columns:1.5fr 1fr;gap:36px;align-items:start;min-width:0}
.big-in>div{min-width:0}
.big-in>div{animation:fadeIn .6s cubic-bezier(.2,.8,.3,1) backwards}
.big-in>div:nth-child(2){animation-delay:.12s}
.big .poster{height:352px;max-width:100%;border-radius:16px;border:1px solid var(--rule)}
.big .play{width:74px;height:74px}
.big h1{font-size:40px;font-weight:900;font-variation-settings:'SOFT' 70,'WONK' 1;letter-spacing:-.03em;margin-top:4px}
.big .pitch{font-size:16.5px;color:var(--ink-2);margin-top:9px}
.chips{display:flex;flex-direction:column;gap:7px;margin:18px 0}
.chip{display:flex;gap:10px;align-items:center;background:var(--page);border:1px solid var(--rule);border-radius:999px;padding:8px 14px;font-size:13.5px;transition:.15s}
.chip:hover{border-color:var(--ink);transform:translateX(3px)}
.chip .t{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:auto}
.sub-cta{font-size:12.5px;color:var(--ink-3);text-align:center;margin-top:10px}

/* question grid */
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.q{background:var(--page);border:1px solid var(--rule);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;
 box-shadow:0 1px 3px rgba(0,0,0,.045);transition:transform .25s cubic-bezier(.2,.8,.3,1),box-shadow .25s;animation:cardIn .5s cubic-bezier(.2,.8,.3,1) backwards}
.q:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.10)}
.q h3{font-size:19px;font-weight:700;line-height:1.25}
.q .foot{display:flex;align-items:center;gap:10px;margin-top:auto}
.stack{display:flex}
.stack .av{margin-right:-7px;border:2px solid var(--page);width:24px;height:24px}
.q .n{font-size:12.5px;color:var(--ink-3);font-weight:500}
.q .arrow{margin-left:auto;color:var(--go-deep);font-weight:700}

/* clip rows */
.cliprow{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.clip{cursor:pointer;animation:cardIn .5s cubic-bezier(.2,.8,.3,1) backwards}
.clip .poster{height:210px;border-radius:12px;border:1px solid var(--rule)}
.clip .play{width:44px;height:44px}
.clip .cap{font-size:13px;font-weight:600;margin-top:9px;line-height:1.35}
.clip .who{font-size:12px;color:var(--ink-3);margin-top:4px;display:flex;align-items:center;gap:6px}

/* profile */
.wall-top{border-bottom:1px solid var(--rule);padding-bottom:34px}
.back{font-size:13.5px;color:var(--ink-3);display:inline-block;margin:20px 0 16px;font-weight:500}
.back:hover{color:var(--ink)}
.ask{background:var(--heat-tint);border-radius:12px;padding:15px 17px;margin-top:18px}
.ask .eyebrow{color:var(--heat);margin-bottom:6px}
.ask p{font-size:14.5px;line-height:1.5}
.ask button{margin-top:11px;font-size:13px;font-weight:600;color:var(--heat);border:1px solid var(--heat);padding:6px 14px;border-radius:999px}
.factline{display:flex;gap:26px;margin-top:18px;flex-wrap:wrap}
.fact .n{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.02em}
.fact .l{font-size:11.5px;color:var(--ink-3)}
.jbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:26px 0 0;max-width:760px}
.jbar .lab{font-family:var(--display);font-size:22px;font-weight:800;margin-right:6px}
.jbar button{font-size:13px;font-weight:600;border:1px solid var(--rule);background:var(--page);border-radius:999px;padding:6px 14px;color:var(--ink-2);transition:.15s}
.jbar button:hover{border-color:var(--ink);color:var(--ink)}
.jbar .done{color:var(--go-deep);border-color:var(--go-tint);background:var(--go-tint)}
.timeline{padding:22px 0 70px;max-width:760px}
.chapter{border-top:1px solid var(--rule);padding-top:24px;margin-top:30px}
.chapter:first-child{border-top:none;margin-top:0;padding-top:0}
.chap-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.chap-head h3{font-size:21px;font-weight:800}
.chap-head .dur{font-size:12.5px;color:var(--ink-3)}
.entry{border-left:2px solid var(--rule);padding:0 0 24px 24px;position:relative;animation:fadeIn .5s cubic-bezier(.2,.8,.3,1) backwards}
.entry:last-child{padding-bottom:0}
.entry::before{content:"";position:absolute;left:-5px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--rule-2)}
.entry.milestone{border-left-color:var(--go)}
.entry.milestone::before{background:var(--go);width:10px;height:10px;left:-6px}
.entry.miss{border-left-color:var(--warn)}
.entry.miss::before{background:var(--warn)}
.entry .when{font-size:12px;color:var(--ink-3);font-weight:500}
.entry h4{font-size:17px;font-weight:700;margin-top:3px}
.entry p{font-size:15px;color:var(--ink-2);margin-top:7px}
.entry .pill{margin-top:10px;display:inline-block}
.inline-clip{display:flex;gap:14px;align-items:center;background:var(--page);border:1px solid var(--rule);border-radius:12px;padding:10px;margin-top:12px;cursor:pointer;transition:.2s}
.inline-clip:hover{border-color:var(--ink);transform:translateX(3px)}
.inline-clip .poster{width:118px;height:70px;border-radius:8px;flex:none}
.inline-clip .play{width:30px;height:30px;box-shadow:none}
.inline-clip .q{font-size:13.5px;font-weight:600;line-height:1.35;border:none;padding:0;background:none;box-shadow:none;animation:none;display:block}
.inline-clip .m{font-size:11.5px;color:var(--ink-3);margin-top:3px;font-family:var(--mono)}
.collapsed{font-size:13px;color:var(--ink-3);padding-left:24px;border-left:2px solid var(--rule)}

/* misc */
.rail-box{background:var(--page);border:1px solid var(--rule);border-radius:14px;padding:18px 20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.rail-box h4{font-size:16px;font-weight:700}
.rail-box .sub{font-size:12.5px;color:var(--ink-3);margin:2px 0 10px}
.rail-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--rule);font-size:14px}
.rail-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.rail-item .amt{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.tabbar{display:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:20px;z-index:60}
.sheet{background:var(--page);border-radius:16px;width:100%;max-width:400px;padding:30px 28px 24px;position:relative}
.sheet h2{font-size:26px;font-weight:800}
.sheet .lede{font-size:14.5px;color:var(--ink-2);margin-top:7px}
.tabs{display:flex;border-bottom:1px solid var(--rule);margin:22px 0 18px}
.tabs button{flex:1;font-size:14px;font-weight:600;padding:10px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--go)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.field input{width:100%;padding:11px 14px;border:1px solid var(--rule-2);border-radius:10px;font:inherit;font-size:15px}
.field input:focus{outline:none;border-color:var(--ink)}
.err{font-size:13px;color:var(--dead);margin-bottom:10px;display:none}.err.show{display:block}
.sheet .btn{width:100%;padding:12px}
.fine{font-size:12px;color:var(--ink-3);text-align:center;margin-top:14px;line-height:1.5}
.close{position:absolute;top:14px;right:16px;color:var(--ink-3);font-size:22px;line-height:1}
.empty{text-align:center;padding:80px 20px;max-width:440px;margin:0 auto}
.empty .mk{height:36px;margin:0 auto 22px;opacity:.3}
.empty h2{font-size:28px;font-weight:800}
.empty p{color:var(--ink-2);margin-top:10px;font-size:15.5px}
.empty .btn{margin-top:22px}
.convert{background:var(--ink);color:#fff;border-radius:16px;padding:40px;text-align:center;margin:0 0 12px}
.convert h2{font-size:30px;font-weight:800;color:#fff}
.convert p{color:#BDBDBD;margin-top:10px;max-width:46ch;margin-left:auto;margin-right:auto}
.convert .btn{margin-top:20px}
footer{border-top:1px solid var(--rule);padding:28px 0 48px;font-size:13px;color:var(--ink-3)}
footer .fin{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
footer button{font-size:13px;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px}
body.ids [data-id]{outline:1px dashed rgba(90,46,196,.4)}
body.ids [data-id]::after{content:attr(data-id);position:absolute;top:0;right:0;background:var(--heat);color:#fff;font:600 9px/1.4 var(--mono);padding:1px 4px;z-index:9}



/* ---------- profile ---------- */
.pbanner{position:relative;height:300px;overflow:hidden;border-bottom:1px solid var(--rule);background:var(--soft)}
.pbanner .art{position:absolute;inset:0;width:100%;height:100%}
.pbanner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.10),rgba(0,0,0,0) 45%,rgba(0,0,0,.06))}
.pshell{display:grid;grid-template-columns:1fr 344px;gap:44px;align-items:start;padding-bottom:80px}
.pid{display:flex;gap:18px;align-items:flex-end;margin-top:-40px;position:relative;z-index:4}
.pid .plogo{width:96px;height:96px;border-radius:24px;display:grid;place-items:center;flex:none;border:4px solid var(--bg);box-shadow:0 4px 18px rgba(0,0,0,.16)}
.pid .plogo svg{width:46px;height:46px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pid h1{font-size:38px;font-weight:900;font-variation-settings:'SOFT' 70,'WONK' 1;letter-spacing:-.03em;padding-bottom:4px}
.ptag{font-size:17px;color:var(--ink-2);margin-top:12px;max-width:56ch}
.pline{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--ink-2);flex-wrap:wrap}
.ptabs{display:flex;gap:28px;border-bottom:1px solid var(--rule);margin:26px 0 0}
.ptabs button{font-size:14.5px;font-weight:600;color:var(--ink-3);padding:13px 0;border-bottom:2px solid transparent;margin-bottom:-1px}
.ptabs button:hover{color:var(--ink)}
.ptabs button.on{color:var(--ink);border-bottom-color:var(--go)}
.ptabs .n{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:5px}
.blocks{padding-top:28px;max-width:660px}
.blk{margin-bottom:26px}
.blk h3{font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-family:var(--body);font-weight:700;margin-bottom:7px}
.blk p{font-size:16.5px;line-height:1.62}
.hr{height:1px;background:var(--rule);margin:34px 0 0;max-width:660px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:660px;padding-top:26px}
.gal .poster{height:130px;border-radius:10px;border:1px solid var(--rule)}
.gal .poster.wide{grid-column:span 2;height:130px}
.side{position:sticky;top:132px;display:flex;flex-direction:column;gap:16px}
.scard{background:var(--page);border:1px solid var(--rule);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.scard .promise{margin-top:0;background:none;border:none;padding:0}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;padding-top:16px;border-top:1px solid var(--rule)}
.fact .n{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.02em}
.fact .l{font-size:11.5px;color:var(--ink-3)}
.share{display:flex;gap:8px;margin-top:11px}
.share button{flex:1;font-size:13px;font-weight:600;border:1px solid var(--rule-2);border-radius:999px;padding:9px;color:var(--ink-2)}
.share button:hover{border-color:var(--ink);color:var(--ink)}
.fcard{display:flex;gap:12px;align-items:flex-start}
.fcard .big-av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 15px var(--mono);flex:none}
.fcard .nm{font-family:var(--display);font-size:17px;font-weight:700}
.fcard .lo{font-size:12.5px;color:var(--ink-3)}
.fcard .bio{font-size:13.5px;color:var(--ink-2);margin-top:9px;line-height:1.55}
.std{border:1px solid var(--go-tint);background:var(--go-tint);border-radius:14px;padding:16px 18px}
.std .h{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--go-deep)}
.std ul{list-style:none;margin-top:10px;display:flex;flex-direction:column;gap:5px}
.std li{font-size:12.5px;color:var(--go-deep);display:flex;gap:8px;opacity:.9}
.std li em{font-style:normal;flex:none}
.ownerbar{background:var(--ink);color:#fff;border-radius:14px;padding:18px}
.ownerbar .h{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:9px}
.ownerbar .h span{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--go)}
.ometer{height:6px;background:rgba(255,255,255,.18);border-radius:999px;margin:12px 0 13px;overflow:hidden}
.ometer i{display:block;height:100%;background:var(--go);border-radius:999px}
.ownerbar ul{list-style:none;display:flex;flex-direction:column;gap:7px}
.ownerbar li{font-size:12.5px;color:#B7B7B7;display:flex;gap:9px;align-items:center}
.ownerbar li.y{color:#fff}
.ownerbar li em{font-style:normal;flex:none;width:14px}
.ownerbar li.n em{color:var(--go)}
.viewtoggle{font-size:12px;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px;margin-top:2px}
@media(max-width:1000px){
 .pshell{grid-template-columns:1fr;gap:30px}
 .side{position:static}
 .pbanner{height:210px}
 .gal{max-width:none}
}
@media(max-width:680px){
 .pbanner{height:150px}
 .pid{flex-direction:column;align-items:flex-start;gap:12px;margin-top:-32px}
 .pid .plogo{width:74px;height:74px;border-radius:19px}
 .pid .plogo svg{width:35px;height:35px}
 .pid h1{font-size:28px}
 .ptabs{gap:20px;overflow-x:auto}
 .gal{grid-template-columns:repeat(2,1fr)}
 .blk p{font-size:15.5px}
}






/* ---------- links ---------- */
.sitecard{display:flex;align-items:center;gap:13px;background:var(--page);border:1px solid var(--ink);border-radius:14px;padding:15px 17px;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.sitecard:hover{background:var(--ink);box-shadow:0 8px 22px rgba(0,0,0,.14)}
.sitecard:hover .u,.sitecard:hover .lb,.sitecard:hover .go{color:#fff}
.sitecard .fav{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff;font:700 15px var(--display)}
.sitecard .lb{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.sitecard .u{font-size:15.5px;font-weight:700;font-family:var(--display);letter-spacing:-.01em;margin-top:1px;word-break:break-all}
.sitecard .go{margin-left:auto;color:var(--ink-3);font-weight:700;flex:none}
.sitecard.soft{border-color:var(--rule);border-style:dashed;cursor:default}
.sitecard.soft:hover{background:var(--page);box-shadow:0 1px 3px rgba(0,0,0,.05)}
.sitecard.soft .u{color:var(--ink-3);font-size:14px}
.sitestat{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;margin-top:7px;display:inline-block}
.socials{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.socials a{display:flex;align-items:center;gap:7px;border:1px solid var(--rule);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--ink-2);transition:.15s}
.socials a:hover{border-color:var(--ink);color:var(--ink);background:var(--soft)}
.socials svg{width:14px;height:14px;flex:none}
.socials .none{font-size:12.5px;color:var(--ink-3);padding:7px 0}
.socials a svg{width:15px;height:15px;flex:none}
.clicknote{font-size:11.5px;color:var(--ink-3);margin-top:13px;padding-top:11px;border-top:1px solid var(--rule);display:flex;align-items:center;gap:6px}
.clicknote b{font-family:var(--mono);color:var(--ink);font-weight:600}
@media(max-width:680px){.sitecard .u{font-size:14px}}


/* ---------- shorts feed ---------- */
.shortsfeed{max-width:428px;margin:0 auto;padding:24px 0 80px;display:flex;flex-direction:column;gap:26px}
.sf{background:var(--page);border:1px solid var(--rule);border-radius:18px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05);animation:cardIn .5s cubic-bezier(.2,.8,.3,1) backwards}
.sf .poster{height:520px;border-radius:0;cursor:pointer}
.sf .play{width:64px;height:64px}
.sf .hook{font-size:30px;left:18px;bottom:18px}
.sf-body{padding:15px 17px 16px}
.sf-body .who{display:flex;align-items:center;gap:10px}
.sf-body .who .nm{font-family:var(--display);font-size:16px;font-weight:700;line-height:1.2}
.sf-body .who .lo{font-size:12px;color:var(--ink-3)}
.sf-body .cap{font-size:14.5px;margin-top:11px;line-height:1.45}
.sf-body .cap b{font-weight:600}
.sf-acts{display:flex;align-items:center;gap:8px;margin-top:14px}
.act{display:flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--ink-2);transition:.15s}
.act:hover{border-color:var(--ink);color:var(--ink)}
.act.liked{background:var(--dead-tint);border-color:var(--dead-tint);color:var(--dead)}
.sf-acts .jr{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--go-deep)}

/* ---------- answers index ---------- */
.qstage{margin-bottom:34px}
.qstage h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-family:var(--body);font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.qstage h3::after{content:"";flex:1;height:1px;background:var(--rule)}
.qlist{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.qrow{display:flex;align-items:center;gap:14px;background:var(--page);border:1px solid var(--rule);border-radius:12px;padding:15px 17px;transition:.16s}
.qrow:hover{border-color:var(--ink);transform:translateX(3px)}
.qrow .txt{font-family:var(--display);font-size:16px;font-weight:700;line-height:1.3;flex:1}
.qrow .n{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.qrow .arrow{color:var(--go-deep);font-weight:700}

/* ---------- post-mortems ---------- */
.pm-hero{background:var(--ink);color:#fff;border-radius:18px;padding:40px;margin-bottom:34px}
.pm-hero h1{font-size:clamp(27px,4vw,40px);font-weight:900;color:#fff;letter-spacing:-.03em;max-width:20ch}
.pm-hero p{color:#B4B4B4;margin-top:12px;max-width:56ch;font-size:16px}
.pm{background:var(--page);border:1px solid var(--rule);border-radius:14px;overflow:hidden;cursor:pointer;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.pm:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.1)}
.pm .poster{height:150px;border-radius:0}
.pm-body{padding:16px 18px 18px}
.pm-body h3{font-size:19px;font-weight:700}
.pm-body .lesson{font-size:15px;line-height:1.55;color:var(--ink-2);margin-top:9px;border-left:3px solid var(--dead);padding-left:13px}
.pm-body .meta{font-size:12px;color:var(--ink-3);margin-top:12px;display:flex;gap:12px;flex-wrap:wrap}

/* ---------- auth pages ---------- */
.authpage{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;padding:56px 0 80px;max-width:940px;margin:0 auto}
.authbox{background:var(--page);border:1px solid var(--rule);border-radius:18px;padding:32px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.authbox h1{font-size:29px;font-weight:900;letter-spacing:-.03em}
.authbox .lede{font-size:14.5px;color:var(--ink-2);margin-top:8px}
.authside h2{font-size:26px;font-weight:800;letter-spacing:-.025em}
.authside ul{list-style:none;margin-top:20px;display:flex;flex-direction:column;gap:14px}
.authside li{display:flex;gap:12px;font-size:15px;color:var(--ink-2);line-height:1.5}
.authside li em{font-style:normal;color:var(--go-deep);font-weight:700;flex:none}
.altline{text-align:center;font-size:13px;color:var(--ink-3);margin-top:16px}
.altline a{color:var(--go-deep);font-weight:600}
.oauth{display:flex;flex-direction:column;gap:9px;margin-bottom:18px}
.oauth button{border:1px solid var(--rule-2);border-radius:999px;padding:11px;font-size:14px;font-weight:600;transition:.15s}
.oauth button:hover{border-color:var(--ink);background:var(--soft)}
.ordiv{display:flex;align-items:center;gap:12px;font-size:11.5px;color:var(--ink-3);margin-bottom:16px}
.ordiv::before,.ordiv::after{content:"";flex:1;height:1px;background:var(--rule)}

/* ---------- start a journey ---------- */
.wizard{max-width:660px;margin:0 auto;padding:36px 0 80px}
.steps{display:flex;gap:8px;margin-bottom:26px}
.steps div{flex:1;height:4px;background:var(--rule);border-radius:999px;overflow:hidden}
.steps div.on i{display:block;height:100%;background:var(--go);border-radius:999px}
.wizard h1{font-size:31px;font-weight:900;letter-spacing:-.03em}
.wizard .lede{font-size:16px;color:var(--ink-2);margin-top:9px}
.wform{background:var(--page);border:1px solid var(--rule);border-radius:16px;padding:26px;margin-top:24px}
.wfield{margin-bottom:18px}
.wfield label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.wfield .hint{font-size:12.5px;color:var(--ink-3);margin-bottom:8px}
.wfield input,.wfield textarea{width:100%;padding:11px 14px;border:1px solid var(--rule-2);border-radius:10px;font:inherit;font-size:15px;background:var(--page);color:var(--ink)}
.wfield textarea{min-height:88px;resize:vertical;line-height:1.55}
.wfield input:focus,.wfield textarea:focus{outline:none;border-color:var(--ink)}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:10px;border:2px solid transparent}
.swatches button.on{border-color:var(--ink)}
.wnav{display:flex;gap:11px;margin-top:8px}
.wnav .btn{flex:1;padding:13px}
.checklist{margin-top:22px;background:var(--soft);border-radius:14px;padding:18px 20px}
.checklist .h{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin-bottom:12px}
.checklist li{list-style:none;display:flex;gap:10px;font-size:13.5px;color:var(--ink-3);padding:4px 0}
.checklist li.y{color:var(--ink)}
.checklist li em{font-style:normal;color:var(--go-deep);flex:none;width:15px}

/* ---------- dashboard ---------- */
.dash{display:grid;grid-template-columns:1fr 320px;gap:32px;padding:34px 0 80px;align-items:start}
.dnums{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.dnum{background:var(--page);border:1px solid var(--rule);border-radius:14px;padding:16px}
.dnum .n{font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-.025em}
.dnum .l{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.dnum .d{font-size:11px;color:var(--go-deep);font-weight:600;margin-top:5px;font-family:var(--mono)}
.todo{background:var(--page);border:1px solid var(--rule);border-radius:14px;padding:20px 22px}
.todo h3{font-size:18px;font-weight:800;margin-bottom:6px}
.todo .sub{font-size:13px;color:var(--ink-3);margin-bottom:14px}
.todo-item{display:flex;align-items:center;gap:13px;padding:13px 0;border-top:1px solid var(--rule)}
.todo-item .ic{width:30px;height:30px;border-radius:9px;background:var(--soft);display:grid;place-items:center;flex:none;font-size:14px}
.todo-item .t{flex:1;font-size:14px;font-weight:500}
.todo-item .t span{display:block;font-size:12px;color:var(--ink-3);font-weight:400;margin-top:1px}
.todo-item .btn{padding:7px 15px;font-size:13px}

/* ---------- stage filter ---------- */
.stagebar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.stagebar button{font-size:13px;font-weight:600;border:1px solid var(--rule);background:var(--page);border-radius:999px;padding:7px 15px;color:var(--ink-2);transition:.15s}
.stagebar button:hover{border-color:var(--ink);color:var(--ink)}
.stagebar button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.stagebar .ct{font-family:var(--mono);font-size:10.5px;opacity:.6;margin-left:5px}

@media(max-width:1000px){
 .authpage{grid-template-columns:1fr;gap:32px;padding:32px 0 60px}
 .authside{order:-1}
 .dash{grid-template-columns:1fr;gap:26px}
 .dnums{grid-template-columns:repeat(2,1fr)}
 .qlist{grid-template-columns:1fr}
}
@media(max-width:680px){
 .filters{position:static}
 .shortsfeed{max-width:none;padding:16px 0 70px;gap:18px}
 .sf .poster{height:440px}.sf .hook{font-size:23px}
 .pm-hero{padding:24px 20px}
 .wizard{padding:24px 0 60px}.wizard h1{font-size:25px}
 .wform{padding:18px}
 .authbox{padding:22px}
}

/* ---------- landing tagline ---------- */
.tagline{padding:44px 0 30px;animation:fadeIn .6s cubic-bezier(.2,.8,.3,1) backwards}
.tagline h1{font-size:clamp(30px,4.4vw,50px);font-weight:900;font-variation-settings:'SOFT' 70,'WONK' 1;
 letter-spacing:-.033em;line-height:1.04;max-width:19ch}
.tagline h1 em{font-style:normal;color:var(--go-deep)}
.tagline p{font-size:17px;color:var(--ink-2);margin-top:14px;max-width:52ch}
.path{display:flex;align-items:center;gap:9px;margin-top:22px;flex-wrap:wrap}
.path b{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);
 background:var(--page);border:1px solid var(--rule);border-radius:999px;padding:6px 13px;white-space:nowrap}
.path b.cash{color:var(--go-deep);border-color:var(--go-tint);background:var(--go-tint)}
.path i{font-style:normal;color:var(--rule-2);font-size:13px}
@media(max-width:680px){
 .tagline{padding:26px 0 20px}
 .tagline p{font-size:15px;margin-top:11px}
 .path{gap:6px;margin-top:16px}
 .path b{font-size:10px;padding:5px 10px}
}

/* ---------- hero card ---------- */
.herocard{background:var(--page);border:1px solid var(--rule);border-radius:18px;padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.herocard .shorts{margin-top:24px;padding-top:22px;border-top:1px solid var(--rule);grid-template-columns:repeat(4,1fr)}
.herocard .shorts-head{margin-bottom:14px}
.herocard .big-in{gap:30px}
.herocard .big .poster{height:326px}

/* ---------- horizontal rails ---------- */
.railh{display:flex;gap:18px;overflow-x:auto;padding:2px 2px 12px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.railh::-webkit-scrollbar{height:6px}
.railh::-webkit-scrollbar-thumb{background:var(--rule-2);border-radius:999px}
.railh>*{scroll-snap-align:start;flex:none}
.railh .card{width:328px}
.pitchcard{width:196px;cursor:pointer;animation:cardIn .5s cubic-bezier(.2,.8,.3,1) backwards}
.pitchcard .poster{height:300px;border-radius:14px;border:1px solid var(--rule)}
.pitchcard .play{width:44px;height:44px}
.pitchcard .hook{font-size:21px}
.pitchcard .nm{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;font-weight:700;font-family:var(--display)}
.pitchcard .sub{font-size:12.5px;color:var(--ink-2);margin-top:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pitchcard .eng{display:flex;gap:12px;margin-top:6px;font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}
.pitchcard:hover .nm{text-decoration:underline;text-underline-offset:3px}
.stagetag{position:absolute;left:12px;top:12px;z-index:3;background:rgba(255,255,255,.94);border-radius:999px;padding:4px 10px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
@media(max-width:680px){
 .herocard{padding:14px;border-radius:14px}
 .herocard .shorts{grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;padding-top:18px}
 .railh .card{width:268px}
 .pitchcard{width:158px}.pitchcard .poster{height:248px}.pitchcard .hook{font-size:16px}
}




/* ---------- links ---------- */

/* ---------- dashboard ---------- */
.dash{display:grid;grid-template-columns:1fr 320px;gap:32px;padding:34px 0 80px;align-items:start}

function Promise(v){

function allShorts(){
  const out=[];
  Object.entries(ELEVATOR).forEach(([slug,e])=>out.push({slug,q:'The elevator pitch',hook:e.hook,tag:e.line,dur:e.dur,likes:e.likes,comments:e.comments}));
  Object.entries(REELS).forEach(([slug,rs])=>rs.slice(1).forEach(r=>out.push({slug,...r})));
  return out.sort((a,b)=>b.likes-a.likes);
}

/* ===================== START A JOURNEY ===================== */
const draft={name:'',pitch:'',problem:'',who:'',why:'',brand:'#1F6F5C',promise:'',due:''};
function setDraft(k,val){draft[k]=val;if(k==='brand')route()}
function StartJourney(step){
  step=+(step||1);
  const done=[!!draft.name&&!!draft.pitch,!!draft.problem&&!!draft.who&&!!draft.why,!!draft.promise&&!!draft.due];
  const chk=[['A name and a one-line pitch',done[0]],['The problem, in plain words',done[1]],['Who it is for',!!draft.who],
    ['Why you',!!draft.why],['A first promise with a date',done[2]],['Three clips or nine photos',false],['A link people can visit',false]];
  return `<div class="wrap"><div class="wizard" data-id="wizard">
    <div class="steps">${[1,2,3].map(n=>`<div class="${n<=step?'on':''}"><i></i></div>`).join('')}</div>
    ${step===1?`
      <h1>Start with the idea.</h1>
      <div class="lede">No revenue needed, no product needed. Week one counts here.</div>
      <div class="wform">
        <div class="wfield"><label>What are you calling it?</label>
          <input value="${draft.name}" oninput="setDraft('name',this.value)" placeholder="Halyard"></div>
        <div class="wfield"><label>One line — what does it do?</label>
          <div class="hint">Plain English. No mission statements.</div>
          <input value="${draft.pitch}" oninput="setDraft('pitch',this.value)" placeholder="Crew rostering for charter boat operators"></div>
        <div class="wfield"><label>Pick a colour</label>
          <div class="swatches">${['#1F6F5C','#B4451A','#1A5C8A','#3D6B24','#9A2A55','#4A4A8A','#8A5A1A'].map(c=>
            `<button style="background:${c}" class="${draft.brand===c?'on':''}" onclick="setDraft('brand','${c}')"></button>`).join('')}</div></div>
        <div class="wnav"><a class="btn btn-go" href="#/start/2">Next — the pitch</a></div>
      </div>`
    :step===2?`
      <h1>Three questions everyone answers.</h1>
      <div class="lede">Same three on every profile, so people can compare yours to the rest.</div>
      <div class="wform">
        <div class="wfield"><label>The problem</label>
          <div class="hint">What is broken, and for whom. Two or three sentences.</div>
          <textarea oninput="setDraft('problem',this.value)" placeholder="Charter crew rostering runs on paper and group chats because every tool built for it is really a restaurant tool...">${draft.problem}</textarea></div>
        <div class="wfield"><label>Who it is for</label>
          <textarea oninput="setDraft('who',this.value)" placeholder="Small charter operators running two to eight boats with casual crew.">${draft.who}</textarea></div>
        <div class="wfield"><label>Why you</label>
          <div class="hint">The bit people actually remember.</div>
          <textarea oninput="setDraft('why',this.value)" placeholder="Eleven years skippering. I made every one of those rosters by hand.">${draft.why}</textarea></div>
        <div class="wnav"><a class="btn btn-line" href="#/start/1" style="flex:0 0 110px">Back</a>
          <a class="btn btn-go" href="#/start/3">Next — your promise</a></div>
      </div>`
    :`
      <h1>Make one promise.</h1>
      <div class="lede">Something you will have done by a date. We show the clock, and we show whether you made it.</div>
      <div class="wform">
        <div class="wfield"><label>What will you have done?</label>
          <input value="${draft.promise}" oninput="setDraft('promise',this.value)" placeholder="Talk to ten skippers"></div>
        <div class="wfield"><label>By when?</label>
          <input type="date" value="${draft.due}" oninput="setDraft('due',this.value)"></div>
        <div class="wfield" style="margin-bottom:0">
          <div class="hint">Missing it is fine — plenty of people here have. Explaining why is the interesting part.</div></div>
        <div class="wnav"><a class="btn btn-line" href="#/start/2" style="flex:0 0 110px">Back</a>
          <button class="btn btn-go" onclick="navigate('/dashboard')">Create my journey</button></div>
      </div>`}
    <div class="checklist">
      <div class="h">Before it goes public</div>
      <ul>${chk.map(([t,ok])=>`<li class="${ok?'y':''}"><em>${ok?'✓':'○'}</em>${t}</li>`).join('')}</ul>
    </div>
  </div></div>`;
}

function renderChrome(){
  $('#searchIco').innerHTML=ICONS.search; $('#searchBtn').innerHTML=ICONS.search;
  const n=state.follows.size;
  $('#followLink').innerHTML=ICONS.heart.replace(/20/g,'17')+`<span>Following</span>${n?`<span class="count">${n}</span>`:''}`;
  $('#authArea').innerHTML=state.user?`<a href="#/following" class="me">${initials(state.user)}</a>`
    :`<button class="lnk btn-login" onclick="openAuth('login')">Log in</button>`;
  const h='#'+ROUTE;
  $('#tabbar').innerHTML=[['#/','Home','home'],['#/shorts','Shorts','play'],['#/following','Following','heart'],
   [state.user?'#/dashboard':'#/login','Account','user']]
   .map(([href,label,ic])=>{const on=href==='#/'?(h==='#/'||h===''||h.startsWith('#/rung/')):h.startsWith(href);
    return `<a href="${href}" class="${on?'on':''}">${ICONS[ic]}<span>${label}</span></a>`}).join('');
}
let ROUTE='/';
function navigate(path){
  ROUTE=path||'/';
  try{history.replaceState(null,'','#'+ROUTE)}catch(e){}
  route();
}
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#"]');
  if(!a) return;
  e.preventDefault();
  const h=a.getAttribute('href');
  if(h==='#'||h==='#/'){navigate('/');return}
  navigate(h.slice(1)||'/');
});
function go(e){navigate((e.currentTarget.dataset.href||'#/').slice(1))}
function jump(k){const el=document.getElementById('seg-'+k)||document.getElementById('ch-'+k);
  if(el)window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-130,behavior:'smooth'})}
function toggleFollow(slug,btn){
  if(!state.user){openAuth('signup',slug);return}
  state.follows.has(slug)?state.follows.delete(slug):state.follows.add(slug);
  const on=state.follows.has(slug);
  if(btn.classList.contains('btn')){btn.classList.toggle('btn-go',!on);btn.classList.toggle('btn-ink',on);btn.textContent=on?'Following':'Follow this build'}
  else{btn.classList.toggle('on',on);btn.textContent=on?'Following':'Follow'}
  renderChrome();
}
function openSearch(){$('#search').classList.add('open');$('#q').focus()}
function closeSearch(){$('#search').classList.remove('open');$('#results').innerHTML=''}
function onSearch(term){
  const t=term.trim().toLowerCase(),box=$('#results');
  if(!t){box.innerHTML='';return}
  const vs=V.filter(v=>(v.name+' '+v.pitch).toLowerCase().includes(t));
  const qs=QUESTIONS.filter(q=>q.q.toLowerCase().includes(t));
  const fs=Object.values(FOUNDERS).filter(f=>(f.name+' '+f.loc).toLowerCase().includes(t));
  if(!vs.length&&!fs.length&&!qs.length){box.innerHTML=`<div class="results"><div class="none">Nothing matches “${term}”. Try <a href="#/rung/idea" onclick="closeSearch()" style="color:var(--go-deep);font-weight:600">the Idea rung</a>.</div></div>`;return}
  box.innerHTML=`<div class="results">
   ${qs.length?`<div class="res-head">Questions</div>`+qs.slice(0,3).map(q=>`<a href="#/q/${q.slug}" onclick="closeSearch()"><span><b>${q.q}</b><br><span class="sub">${q.n} answers</span></span></a>`).join(''):''}
   ${vs.length?`<div class="res-head">Stories</div>`+vs.slice(0,4).map(v=>`<a href="#/v/${v.slug}" onclick="closeSearch()">${Logo(v,'logo-xs')}<span><b>${v.name}</b> <span class="sub">· ${RUNGS[rungIndex(v.rung)].label}</span><br><span class="sub">${v.pitch}</span></span></a>`).join(''):''}
   ${fs.length?`<div class="res-head">Founders</div>`+fs.slice(0,3).map(f=>`<a href="#/" onclick="closeSearch()"><span class="av" style="background:${f.hue}">${initials(f.name)}</span><span><b>${f.name}</b><br><span class="sub">${f.loc}</span></span></a>`).join(''):''}
  </div>`;
}
let pendingFollow=null;
function openAuth(mode,follow){pendingFollow=follow||null;$('#modal').innerHTML=AuthSheet(mode);setTimeout(()=>$('#email')&&$('#email').focus(),40)}
function closeModal(){$('#modal').innerHTML='';pendingFollow=null}
function AuthSheet(mode){const s=mode==='signup';
 return `<div class="scrim" onclick="if(event.target===this)closeModal()"><div class="sheet" role="dialog" aria-modal="true">
  <button class="close" aria-label="Close" onclick="closeModal()">×</button>
  <h2>${s?'Back somebody early.':'Welcome back.'}</h2>
  <div class="lede">${s?(pendingFollow?`Create an account to follow ${ven(pendingFollow).name} and hear it the day they keep or break a promise.`:'Follow founders from the first sentence onward.'):'Pick up where your founders left off.'}</div>
  <div class="tabs"><button class="${!s?'on':''}" onclick="openAuth('login')">Log in</button><button class="${s?'on':''}" onclick="openAuth('signup')">Sign up</button></div>
  ${s?`<div class="field"><label for="name">Your name</label><input id="name" placeholder="Jordan Lee"></div>`:''}
  <div class="field"><label for="email">Email</label><input id="email" type="email" placeholder="you@example.com"></div>
  <div class="field"><label for="pw">Password</label><input id="pw" type="password" placeholder="••••••••"></div>
  <div class="err" id="authErr"></div>
  <button class="btn btn-go" onclick="submitAuth(${s})">${s?'Create account':'Log in'}</button>
  <div class="fine">Prototype — nothing is sent anywhere.<br>Founders book an interview after signing up.</div>
 </div></div>`}
function submitAuth(s){
  const email=$('#email').value.trim(),pw=$('#pw').value,name=s?$('#name').value.trim():'',err=$('#authErr');
  const fail=m=>{err.textContent=m;err.classList.add('show')};
  if(!email.includes('@'))return fail('Enter an email address that includes an @.');
  if(pw.length<8)return fail('Passwords need at least 8 characters.');
  if(s&&!name)return fail('Add a name so founders know who is following them.');
  state.user=s?name:email.split('@')[0].replace(/[._]/g,' ');
  if(pendingFollow)state.follows.add(pendingFollow);
  closeModal();renderChrome();route();
}
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;
  if(P.slug&&$('#modal').innerHTML){closePlayer();return}
  if($('#modal').innerHTML)closeModal();else if($('#search').classList.contains('open'))closeSearch();else $('#results').innerHTML=''});
document.addEventListener('click',e=>{if(!e.target.closest('#search')&&!$('#search').classList.contains('open'))$('#results').innerHTML=''});


/* ===================== PLAYER ===================== */
const P={slug:null,title:'',dur:0,t:0,playing:false,timer:null};
function openPlayer(slug,title,dur,start=0){
  clearInterval(P.timer);
  P.slug=slug;P.title=title;P.dur=secs(dur);P.t=start;P.playing=true;
  $('#modal').innerHTML=PlayerUI();
  P.timer=setInterval(tick,200);
  paint();
}
function closePlayer(){clearInterval(P.timer);P.playing=false;$('#modal').innerHTML=''}
function togglePlay(){P.playing=!P.playing;paint()}
function tick(){if(!P.playing)return;P.t=Math.min(P.dur,P.t+.2);if(P.t>=P.dur){P.playing=false}paint()}
function seekBar(e){const r=e.currentTarget.getBoundingClientRect();P.t=Math.max(0,Math.min(P.dur,(e.clientX-r.left)/r.width*P.dur));paint()}
function seekTo(n){P.t=n;P.playing=true;paint()}

function PlayerUI(){
  const v=ven(P.slug),f=FOUNDERS[v.founder];
  const tx=TRANSCRIPT[P.title]||[],ch=CHAPTERS[P.title]||[];
  return `<div class="pscrim" onclick="if(event.target===this)closePlayer()">
   <div class="player" role="dialog" aria-modal="true" aria-label="Video player">
    <button class="pclose" aria-label="Close" onclick="closePlayer()">×</button>
    <div class="stage" onclick="togglePlay()">
      ${Art(v)}
      <span class="bigbtn" id="bigbtn">${PLAY}</span>
      <div class="livecap"><span id="livecap"></span></div>
    </div>
    <div class="pctrl"><div class="pbar" onclick="seekBar(event)">
      <i id="pfill"></i>
      ${ch.map(([t])=>`<span class="mk-ch" style="left:${(t/P.dur*100).toFixed(1)}%"></span>`).join('')}
    </div></div>
    <div class="pmeta">
      <button onclick="togglePlay()" id="ppbtn" aria-label="Play or pause">❚❚</button>
      <span class="t"><span id="pnow">0:00</span> / ${clock(P.dur)}</span>
      ${ch.length?`<span id="pch"></span>`:''}
      <a class="jr" href="#/v/${v.slug}" onclick="closePlayer()">View ${v.name}'s journey →</a>
    </div>
    <div class="phead"><h3>${P.title}</h3>
      <div class="who"><span class="av" style="background:${f.hue}">${initials(f.name)}</span>${f.name} · ${v.name}</div></div>
    <div class="tx"><div class="lab">Transcript</div>
      ${tx.length?tx.map(([t,line])=>`<p data-t="${t}" onclick="seekTo(${t})"><b>${clock(t)}</b><span>${line}</span></p>`).join('')
        :`<p style="color:#7A7A7A;cursor:default"><span>Transcript is still processing — it usually lands within an hour of upload.</span></p>`}
    </div>
   </div></div>`;
}

function paint(){
  const fill=$('#pfill'); if(!fill) return;
  fill.style.width=(P.t/P.dur*100)+'%';
  $('#pnow').textContent=clock(P.t);
  $('#ppbtn').textContent=P.playing?'❚❚':'▶';
  $('#bigbtn').classList.toggle('hidden',P.playing);
  const tx=TRANSCRIPT[P.title]||[];
  let cur=null;
  document.querySelectorAll('.tx p[data-t]').forEach(el=>{
    const t=+el.dataset.t, on=P.t>=t;
    el.classList.remove('on');
    if(on) cur=el;
  });
  if(cur){cur.classList.add('on'); $('#livecap').textContent=cur.querySelector('span').textContent}
  else if($('#livecap')) $('#livecap').textContent='';
  const ch=CHAPTERS[P.title]||[],box=$('#pch');
  if(box){const c=[...ch].reverse().find(([t])=>P.t>=t); box.textContent=c?'· '+c[1]:''}
}

/* ===================== ROUTER ===================== */
function nav(){
  const h='#'+ROUTE;
  const is=(pre)=>pre==='#/'?(h==='#/'||h===''||h.startsWith('#/rung/')):h.startsWith(pre);
  $('#rungnav').innerHTML=[['#/','Discover'],['#/shorts','Shorts'],['#/answers','Answers'],['#/postmortems','Post-mortems']]
    .map(([href,label])=>`<a href="${href}" class="${is(href)?'on':''}">${label}</a>`).join('');
  $('#followLink').classList.toggle('on', ROUTE.startsWith('/following'));
}
function route(){
  const p=(ROUTE||'/').split('/').filter(Boolean);
  let html,active=null;
  switch(p[0]){
    case 'v':            html=Wall(p[1],p[2]); break;
    case 'q':            html=Question(p[1]); break;
    case 'rung':         active=p[1]; html=Home(p[1]); break;
    case 'shorts':       html=Shorts(); break;
    case 'answers':      html=Answers(); break;
    case 'postmortems':  html=PostMortems(); break;
    case 'following':    html=Following(); break;
    case 'login':        html=AuthPage('login'); break;
    case 'signup':       html=AuthPage('signup'); break;
    case 'start':        html=StartJourney(p[1]); break;
    case 'dashboard':    html=Dashboard(); break;
    default:             html=Home();
  }
  clearInterval(P.timer); P.slug=null;
  $('#app').innerHTML=html; renderChrome(); nav(); closeSearch(); window.scrollTo(0,0);
  document.querySelectorAll('.entry').forEach((e,i)=>e.style.animationDelay=(i*.05).toFixed(2)+'s');
  requestAnimationFrame(()=>document.querySelectorAll('.bar i').forEach(b=>{const w=b.style.width;b.style.width='0';requestAnimationFrame(()=>b.style.width=w)}));
}
addEventListener('hashchange',()=>{const h=location.hash.slice(1)||'/';if(h!==ROUTE)navigate(h)});
ROUTE=(location.hash.slice(1)||'/');
route();
</script>
